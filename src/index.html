<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <title>Quincena</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#01696f" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="app-icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado (o el del sistema) antes de pintar, para evitar parpadeos.
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('quincena-theme');
        } catch (e) {}
        if (tema !== 'light' && tema !== 'dark') {
          tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
